name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal schemas)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
        shell: bash
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/dtkit

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - run: go test -race ./...
